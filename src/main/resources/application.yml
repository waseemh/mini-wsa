spring:
  application:
    name: mini-wsa
  datasource:
    url: jdbc:postgresql://localhost:5432/miniwsa?reWriteBatchedInserts=true
    username: miniwsa
    password: miniwsa
  jackson:
    deserialization:
      # lets POST /v1/events/ingest take a single event or an array
      accept-single-value-as-array: true
    mapper:
      # strict input: no "77" for a number field, no epoch number for an ISO timestamp
      allow-coercion-of-scalars: false
